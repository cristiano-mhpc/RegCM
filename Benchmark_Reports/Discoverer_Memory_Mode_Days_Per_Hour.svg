<svg xmlns="http://www.w3.org/2000/svg" width="860" height="700" viewBox="0 0 860 700" role="img" aria-labelledby="title desc">
  <title id="title">RegCM EURR-3 days/hour comparison</title>
  <desc id="desc">Comparison of local Discoverer+ memory modes, validated four- and eight-GPU asynchronous-I/O results on Discoverer+ node dgx1 using the OMP4 NUMA-pool configuration, Leonardo DCGP CPU and A100 GPU reference points, and Everett GB200 results.</desc>
  <rect width="860" height="700" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333333">RegCM EURR-3 Days/Hour Comparison</text>

  <line x1="80" y1="470" x2="720" y2="470" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="470" stroke="#333333" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="80" y1="470" x2="720" y2="470" stroke="#dddddd"/>
    <text x="68" y="474.5" text-anchor="end">0</text>
    <line x1="80" y1="401.7" x2="720" y2="401.7" stroke="#eeeeee"/>
    <text x="68" y="406.2" text-anchor="end">4</text>
    <line x1="80" y1="333.3" x2="720" y2="333.3" stroke="#dddddd"/>
    <text x="68" y="337.8" text-anchor="end">8</text>
    <line x1="80" y1="265" x2="720" y2="265" stroke="#eeeeee"/>
    <text x="68" y="269.5" text-anchor="end">12</text>
    <line x1="80" y1="196.7" x2="720" y2="196.7" stroke="#dddddd"/>
    <text x="68" y="201.2" text-anchor="end">16</text>
    <line x1="80" y1="128.3" x2="720" y2="128.3" stroke="#eeeeee"/>
    <text x="68" y="132.8" text-anchor="end">20</text>
    <line x1="80" y1="60" x2="720" y2="60" stroke="#dddddd"/>
    <text x="68" y="64.5" text-anchor="end">24</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="80" y1="470" x2="80" y2="476" stroke="#333333"/>
    <text x="80" y="496" text-anchor="middle">2</text>
    <line x1="122.7" y1="470" x2="122.7" y2="476" stroke="#333333"/>
    <text x="122.7" y="496" text-anchor="middle">4</text>
    <line x1="208" y1="470" x2="208" y2="476" stroke="#333333"/>
    <text x="208" y="496" text-anchor="middle">8</text>
    <line x1="293.3" y1="470" x2="293.3" y2="476" stroke="#333333"/>
    <text x="293.3" y="496" text-anchor="middle">12</text>
    <line x1="336" y1="470" x2="336" y2="476" stroke="#333333"/>
    <text x="336" y="496" text-anchor="middle">14</text>
    <line x1="378.7" y1="470" x2="378.7" y2="476" stroke="#333333"/>
    <text x="378.7" y="496" text-anchor="middle">16</text>
    <line x1="720" y1="470" x2="720" y2="476" stroke="#333333"/>
    <text x="720" y="496" text-anchor="middle">32</text>
  </g>

  <text x="400" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333333">GPUs / DCGP nodes</text>
  <text x="22" y="210" text-anchor="middle" transform="rotate(-90 22 210)" font-family="Arial, sans-serif" font-size="16" fill="#333333">Simulated days per hour</text>

  <polyline points="122.7,396.3 208,329.2 293.3,301.6 336,332.3" fill="none" stroke="#156082" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="122.7,405.9 208,360.0 293.3,342.7 336,357.3" fill="none" stroke="#e97132" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="122.7,365.8 208,292.7 378.7,213.8 720,147.1" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="122.7,343.4 208,263.4 378.7,143.8 720,72.0" fill="none" stroke="#2ca02c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="80,463.8 122.7,455.7 208,440.4 378.7,416.5" fill="none" stroke="#9467bd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
  <polyline points="122.7,439.4 208,390.9 378.7,344.0 720,319.5" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5"/>
  <polyline points="122.7,375.3 208,309.0" fill="none" stroke="#00a6a6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>

