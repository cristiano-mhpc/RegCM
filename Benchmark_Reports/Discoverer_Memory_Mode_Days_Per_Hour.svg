<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565" role="img" aria-labelledby="title desc">
  <title id="title">RegCM EURR-3 days/hour comparison</title>
  <desc id="desc">Comparison of local Discoverer+ memory modes, validated four- and eight-GPU asynchronous-I/O results on Discoverer+ node dgx1 using the OMP4 NUMA-pool configuration, Leonardo DCGP CPU and A100 GPU reference points, and Everett GB200 results.</desc>
  <rect width="1100" height="565" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333333">RegCM EURR-3 Days/Hour Comparison</text>

  <line x1="90" y1="360" x2="950" y2="360" stroke="#333333" stroke-width="1.5"/>
  <line x1="90" y1="60" x2="90" y2="360" stroke="#333333" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="90" y1="360" x2="950" y2="360" stroke="#dddddd"/>
    <text x="68" y="364.5" text-anchor="end">0</text>
    <line x1="90" y1="310" x2="950" y2="310" stroke="#eeeeee"/>
    <text x="68" y="314.5" text-anchor="end">4</text>
    <line x1="90" y1="260" x2="950" y2="260" stroke="#dddddd"/>
    <text x="68" y="264.5" text-anchor="end">8</text>
    <line x1="90" y1="210" x2="950" y2="210" stroke="#eeeeee"/>
    <text x="68" y="214.5" text-anchor="end">12</text>
    <line x1="90" y1="160" x2="950" y2="160" stroke="#dddddd"/>
    <text x="68" y="164.5" text-anchor="end">16</text>
    <line x1="90" y1="110" x2="950" y2="110" stroke="#eeeeee"/>
    <text x="68" y="114.5" text-anchor="end">20</text>
    <line x1="90" y1="60" x2="950" y2="60" stroke="#dddddd"/>
    <text x="68" y="64.5" text-anchor="end">24</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="90" y1="360" x2="90" y2="366" stroke="#333333"/>
    <text x="90" y="386" text-anchor="middle">2</text>
    <line x1="220" y1="360" x2="220" y2="366" stroke="#333333"/>
    <text x="220" y="386" text-anchor="middle">4</text>
    <line x1="350" y1="360" x2="350" y2="366" stroke="#333333"/>
    <text x="350" y="386" text-anchor="middle">8</text>
    <line x1="480" y1="360" x2="480" y2="366" stroke="#333333"/>
    <text x="480" y="386" text-anchor="middle">12</text>
    <line x1="610" y1="360" x2="610" y2="366" stroke="#333333"/>
    <text x="610" y="386" text-anchor="middle">14</text>
    <line x1="740" y1="360" x2="740" y2="366" stroke="#333333"/>
    <text x="740" y="386" text-anchor="middle">16</text>
    <line x1="950" y1="360" x2="950" y2="366" stroke="#333333"/>
    <text x="950" y="386" text-anchor="middle">32</text>
  </g>

  <text x="520" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333333">GPUs / DCGP nodes</text>
  <text x="22" y="210" text-anchor="middle" transform="rotate(-90 22 210)" font-family="Arial, sans-serif" font-size="16" fill="#333333">Simulated days per hour</text>

  <polyline points="220,306.3 350,257.0 480,236.8 610,259.3" fill="none" stroke="#156082" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="220,313.1 350,279.5 480,266.8 610,277.5" fill="none" stroke="#e97132" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="220,283.8 350,230.0 740,172.5 950,123.8" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="220,267.5 350,208.8 740,121.3 950,68.8" fill="none" stroke="#2ca02c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="90,355.4 220,349.5 350,338.3 740,320.9" fill="none" stroke="#9467bd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
  <polyline points="220,337.6 350,302.0 740,267.8 950,249.7" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5"/>
  <polyline points="220,291.8 350,242.0" fill="none" stroke="#00a6a6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>

