<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
  <title id="title">RegCM EURR-3 days/hour comparison</title>
  <desc id="desc">Comparison of local Discoverer+ memory modes, Leonardo DCGP CPU and A100 GPU reference points, and Everett GB200 results.</desc>
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333333">RegCM EURR-3 Days/Hour Comparison</text>

  <line x1="80" y1="360" x2="720" y2="360" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="360" stroke="#333333" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="80" y1="360" x2="720" y2="360" stroke="#dddddd"/>
    <text x="68" y="364.5" text-anchor="end">0</text>
    <line x1="80" y1="310" x2="720" y2="310" stroke="#eeeeee"/>
    <text x="68" y="314.5" text-anchor="end">4</text>
    <line x1="80" y1="260" x2="720" y2="260" stroke="#dddddd"/>
    <text x="68" y="264.5" text-anchor="end">8</text>
    <line x1="80" y1="210" x2="720" y2="210" stroke="#eeeeee"/>
    <text x="68" y="214.5" text-anchor="end">12</text>
    <line x1="80" y1="160" x2="720" y2="160" stroke="#dddddd"/>
    <text x="68" y="164.5" text-anchor="end">16</text>
    <line x1="80" y1="110" x2="720" y2="110" stroke="#eeeeee"/>
    <text x="68" y="114.5" text-anchor="end">20</text>
    <line x1="80" y1="60" x2="720" y2="60" stroke="#dddddd"/>
    <text x="68" y="64.5" text-anchor="end">24</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="80.0" y1="360" x2="80.0" y2="366" stroke="#333333"/>
    <text x="80.0" y="386" text-anchor="middle">2</text>
    <line x1="122.7" y1="360" x2="122.7" y2="366" stroke="#333333"/>
    <text x="122.7" y="386" text-anchor="middle">4</text>
    <line x1="208.0" y1="360" x2="208.0" y2="366" stroke="#333333"/>
    <text x="208.0" y="386" text-anchor="middle">8</text>
    <line x1="293.3" y1="360" x2="293.3" y2="366" stroke="#333333"/>
    <text x="293.3" y="386" text-anchor="middle">12</text>
    <line x1="336.0" y1="360" x2="336.0" y2="366" stroke="#333333"/>
    <text x="336.0" y="386" text-anchor="middle">14</text>
    <line x1="378.7" y1="360" x2="378.7" y2="366" stroke="#333333"/>
    <text x="378.7" y="386" text-anchor="middle">16</text>
    <line x1="720.0" y1="360" x2="720.0" y2="366" stroke="#333333"/>
    <text x="720.0" y="386" text-anchor="middle">32</text>
  </g>

  <text x="400" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333333">GPUs / CPU nodes</text>
  <text x="22" y="210" text-anchor="middle" transform="rotate(-90 22 210)" font-family="Arial, sans-serif" font-size="16" fill="#333333">Simulated days per hour</text>

  <polyline points="122.7,306.3 208.0,257.0 293.3,236.8 336.0,259.3" fill="none" stroke="#156082" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="122.7,313.1 208.0,279.5 293.3,266.8 336.0,277.5" fill="none" stroke="#e97132" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="122.7,283.8 208.0,230.0 378.7,172.5 720.0,123.8" fill="none" stroke="#7f7f7f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="122.7,267.5 208.0,208.8 378.7,121.3 720.0,68.8" fill="none" stroke="#2ca02c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="80.0,355.4 122.7,349.5 208.0,338.3 378.7,320.9" fill="none" stroke="#9467bd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
  <polyline points="122.7,337.6 208.0,302.0 378.7,267.8 720.0,249.7" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5"/>

  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="122.7" cy="306.3" r="5.5" fill="#156082"/><circle cx="208.0" cy="257.0" r="5.5" fill="#156082"/><circle cx="293.3" cy="236.8" r="5.5" fill="#156082"/><circle cx="336.0" cy="259.3" r="5.5" fill="#156082"/>
    <circle cx="122.7" cy="313.1" r="5.5" fill="#e97132"/><circle cx="208.0" cy="279.5" r="5.5" fill="#e97132"/><circle cx="293.3" cy="266.8" r="5.5" fill="#e97132"/><circle cx="336.0" cy="277.5" r="5.5" fill="#e97132"/>
    <circle cx="122.7" cy="283.8" r="5.5" fill="#7f7f7f"/><circle cx="208.0" cy="230.0" r="5.5" fill="#7f7f7f"/><circle cx="378.7" cy="172.5" r="5.5" fill="#7f7f7f"/><circle cx="720.0" cy="123.8" r="5.5" fill="#7f7f7f"/>
    <circle cx="122.7" cy="267.5" r="5.5" fill="#2ca02c"/><circle cx="208.0" cy="208.8" r="5.5" fill="#2ca02c"/><circle cx="378.7" cy="121.3" r="5.5" fill="#2ca02c"/><circle cx="720.0" cy="68.8" r="5.5" fill="#2ca02c"/>
    <circle cx="80.0" cy="355.4" r="5.5" fill="#9467bd"/><circle cx="122.7" cy="349.5" r="5.5" fill="#9467bd"/><circle cx="208.0" cy="338.3" r="5.5" fill="#9467bd"/><circle cx="378.7" cy="320.9" r="5.5" fill="#9467bd"/>
    <circle cx="122.7" cy="337.6" r="5.5" fill="#d62728"/><circle cx="208.0" cy="302.0" r="5.5" fill="#d62728"/><circle cx="378.7" cy="267.8" r="5.5" fill="#d62728"/><circle cx="720.0" cy="249.7" r="5.5" fill="#d62728"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#333333">
    <line x1="35" y1="450" x2="75" y2="450" stroke="#156082" stroke-width="4" stroke-linecap="round"/><circle cx="55" cy="450" r="5.5" fill="#156082"/>
    <text x="85" y="455">local mem:managed</text>
    <line x1="285" y1="450" x2="325" y2="450" stroke="#e97132" stroke-width="4" stroke-linecap="round"/><circle cx="305" cy="450" r="5.5" fill="#e97132"/>
    <text x="335" y="455">local mem:unified</text>
    <line x1="545" y1="450" x2="585" y2="450" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/><circle cx="565" cy="450" r="5.5" fill="#7f7f7f"/>
    <text x="595" y="455">Everett previous</text>
    <line x1="25" y1="476" x2="65" y2="476" stroke="#2ca02c" stroke-width="4" stroke-linecap="round"/><circle cx="45" cy="476" r="5.5" fill="#2ca02c"/>
    <text x="75" y="481">Everett mem:unified AsyncIO</text>
    <line x1="300" y1="476" x2="340" y2="476" stroke="#9467bd" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 5"/><circle cx="320" cy="476" r="5.5" fill="#9467bd"/>
    <text x="350" y="481">Leonardo CPU DCGP (100 cores/node)</text>
    <line x1="650" y1="476" x2="690" y2="476" stroke="#d62728" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 5"/><circle cx="670" cy="476" r="5.5" fill="#d62728"/>
    <text x="700" y="481">Leonardo A100 GPUs</text>
  </g>
</svg>
