    <circle cx="220" cy="306.3" r="5.5" fill="#156082"/><circle cx="350" cy="257.0" r="5.5" fill="#156082"/><circle cx="480" cy="236.8" r="5.5" fill="#156082"/><circle cx="610" cy="259.3" r="5.5" fill="#156082"/>
    <circle cx="220" cy="313.1" r="5.5" fill="#e97132"/><circle cx="350" cy="279.5" r="5.5" fill="#e97132"/><circle cx="480" cy="266.8" r="5.5" fill="#e97132"/><circle cx="610" cy="277.5" r="5.5" fill="#e97132"/>
    <circle cx="220" cy="283.8" r="5.5" fill="#7f7f7f"/><circle cx="350" cy="230.0" r="5.5" fill="#7f7f7f"/><circle cx="740" cy="172.5" r="5.5" fill="#7f7f7f"/><circle cx="950" cy="123.8" r="5.5" fill="#7f7f7f"/>
    <circle cx="220" cy="267.5" r="5.5" fill="#2ca02c"/><circle cx="350" cy="208.8" r="5.5" fill="#2ca02c"/><circle cx="740" cy="121.3" r="5.5" fill="#2ca02c"/><circle cx="950" cy="68.8" r="5.5" fill="#2ca02c"/>
    <circle cx="90" cy="355.4" r="5.5" fill="#9467bd"/><circle cx="220" cy="349.5" r="5.5" fill="#9467bd"/><circle cx="350" cy="338.3" r="5.5" fill="#9467bd"/><circle cx="740" cy="320.9" r="5.5" fill="#9467bd"/>
    <circle cx="220" cy="337.6" r="5.5" fill="#d62728"/><circle cx="350" cy="302.0" r="5.5" fill="#d62728"/><circle cx="740" cy="267.8" r="5.5" fill="#d62728"/><circle cx="950" cy="249.7" r="5.5" fill="#d62728"/>
    <polygon points="220,284.8 227,291.8 220,298.8 213,291.8" fill="#00a6a6"/>
    <polygon points="350,235.0 357,242.0 350,249.0 343,242.0" fill="#00a6a6"/>
  </g>

  <text x="135" y="286" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#007f7f">5.45</text>
  <text x="220" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#007f7f">9.44</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#333333">
    <line x1="35" y1="450" x2="70" y2="450" stroke="#156082" stroke-width="4" stroke-linecap="round"/><circle cx="52.5" cy="450" r="5.5" fill="#156082"/>
    <text x="78" y="455">Discoverer+ H200 mem:managed</text>
    <line x1="455" y1="450" x2="490" y2="450" stroke="#e97132" stroke-width="4" stroke-linecap="round"/><circle cx="472.5" cy="450" r="5.5" fill="#e97132"/>
    <text x="498" y="455">Discoverer+ H200 mem:unified</text>
    <polygon points="52.5,473 59.5,480 52.5,487 45.5,480" fill="#00a6a6"/>
    <text x="78" y="485">Discoverer+ H200 dgx1 AsyncIO (OMP4 NUMA)</text>
    <line x1="455" y1="480" x2="490" y2="480" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/><circle cx="472.5" cy="480" r="5.5" fill="#7f7f7f"/>
    <text x="498" y="485">Everett GB200 mem:unified no AsyncIO</text>
    <line x1="35" y1="510" x2="70" y2="510" stroke="#2ca02c" stroke-width="4" stroke-linecap="round"/><circle cx="52.5" cy="510" r="5.5" fill="#2ca02c"/>
    <text x="78" y="515">Everett GB200 mem:unified AsyncIO</text>
    <line x1="455" y1="510" x2="490" y2="510" stroke="#9467bd" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 5"/><circle cx="472.5" cy="510" r="5.5" fill="#9467bd"/>
    <text x="498" y="515">Leonardo CPU DCGP (100 cores/node)</text>
    <line x1="35" y1="540" x2="70" y2="540" stroke="#d62728" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 5"/><circle cx="52.5" cy="540" r="5.5" fill="#d62728"/>
    <text x="78" y="545">Leonardo A100 GPUs</text>
  </g>
</svg>
