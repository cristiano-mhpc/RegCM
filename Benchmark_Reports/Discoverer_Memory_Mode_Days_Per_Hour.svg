    <circle cx="122.7" cy="396.3" r="5.5" fill="#156082"/><circle cx="208" cy="329.2" r="5.5" fill="#156082"/><circle cx="293.3" cy="301.6" r="5.5" fill="#156082"/><circle cx="336" cy="332.3" r="5.5" fill="#156082"/>
    <circle cx="122.7" cy="405.9" r="5.5" fill="#e97132"/><circle cx="208" cy="360.0" r="5.5" fill="#e97132"/><circle cx="293.3" cy="342.7" r="5.5" fill="#e97132"/><circle cx="336" cy="357.3" r="5.5" fill="#e97132"/>
    <circle cx="122.7" cy="365.8" r="5.5" fill="#7f7f7f"/><circle cx="208" cy="292.7" r="5.5" fill="#7f7f7f"/><circle cx="378.7" cy="213.8" r="5.5" fill="#7f7f7f"/><circle cx="720" cy="147.1" r="5.5" fill="#7f7f7f"/>
    <circle cx="122.7" cy="343.4" r="5.5" fill="#2ca02c"/><circle cx="208" cy="263.4" r="5.5" fill="#2ca02c"/><circle cx="378.7" cy="143.8" r="5.5" fill="#2ca02c"/><circle cx="720" cy="72.0" r="5.5" fill="#2ca02c"/>
    <circle cx="80" cy="463.8" r="5.5" fill="#9467bd"/><circle cx="122.7" cy="455.7" r="5.5" fill="#9467bd"/><circle cx="208" cy="440.4" r="5.5" fill="#9467bd"/><circle cx="378.7" cy="416.5" r="5.5" fill="#9467bd"/>
    <circle cx="122.7" cy="439.4" r="5.5" fill="#d62728"/><circle cx="208" cy="390.9" r="5.5" fill="#d62728"/><circle cx="378.7" cy="344.0" r="5.5" fill="#d62728"/><circle cx="720" cy="319.5" r="5.5" fill="#d62728"/>
    <polygon points="122.7,368.3 129.7,375.3 122.7,382.3 115.7,375.3" fill="#00a6a6"/>
    <polygon points="208,302.0 215,309.0 208,316.0 201,309.0" fill="#00a6a6"/>
  </g>

  <text x="135" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#007f7f">5.45</text>
  <text x="220" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#007f7f">9.44</text>

  <g transform="translate(0 120)" font-family="Arial, sans-serif" font-size="13" fill="#333333">
    <line x1="35" y1="450" x2="70" y2="450" stroke="#156082" stroke-width="4" stroke-linecap="round"/><circle cx="52.5" cy="450" r="5.5" fill="#156082"/>
    <text x="78" y="455">Discoverer+ H200 mem:managed</text>
    <line x1="455" y1="450" x2="490" y2="450" stroke="#e97132" stroke-width="4" stroke-linecap="round"/><circle cx="472.5" cy="450" r="5.5" fill="#e97132"/>
    <text x="498" y="455">Discoverer+ H200 mem:unified</text>
    <polygon points="52.5,473 59.5,480 52.5,487 45.5,480" fill="#00a6a6"/>
    <text x="78" y="485">Discoverer+ H200 dgx1 AsyncIO (OMP4 NUMA)</text>
    <line x1="455" y1="480" x2="490" y2="480" stroke="#7f7f7f" stroke-width="4" stroke-linecap="round"/><circle cx="472.5" cy="480" r="5.5" fill="#7f7f7f"/>
    <text x="498" y="485">Everett GB200 mem:unified no AsyncIO</text>
    <line x1="35" y1="510" x2="70" y2="510" stroke="#2ca02c" stroke-width="4" stroke-linecap="round"/><circle cx="52.5" cy="510" r="5.5" fill="#2ca02c"/>
    <text x="78" y="515">Everett GB200 mem:unified AsyncIO</text>
    <line x1="455" y1="510" x2="490" y2="510" stroke="#9467bd" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 5"/><circle cx="472.5" cy="510" r="5.5" fill="#9467bd"/>
    <text x="498" y="515">Leonardo CPU DCGP (100 cores/node)</text>
    <line x1="35" y1="540" x2="70" y2="540" stroke="#d62728" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 5"/><circle cx="52.5" cy="540" r="5.5" fill="#d62728"/>
    <text x="78" y="545">Leonardo A100 GPUs</text>
  </g>
</svg>
