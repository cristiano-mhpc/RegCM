<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-labelledby="title desc">
  <title id="title">RegCM EURR-3 days/hour comparison</title>
  <desc id="desc">Comparison of local mem:managed, local mem:unified, and Everett mem:unified AsyncIO days per hour for available GPU counts.</desc>
  <rect width="820" height="480" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333333">RegCM EURR-3 Days/Hour Comparison</text>

  <line x1="80" y1="360" x2="720" y2="360" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="360" stroke="#333333" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="80" y1="360.0" x2="720" y2="360.0" stroke="#dddddd"/>
    <text x="68" y="364.5" text-anchor="end">0</text>
    <line x1="80" y1="317.1" x2="720" y2="317.1" stroke="#eeeeee"/>
    <text x="68" y="321.6" text-anchor="end">2</text>
    <line x1="80" y1="274.3" x2="720" y2="274.3" stroke="#dddddd"/>
    <text x="68" y="278.8" text-anchor="end">4</text>
    <line x1="80" y1="231.4" x2="720" y2="231.4" stroke="#eeeeee"/>
    <text x="68" y="235.9" text-anchor="end">6</text>
    <line x1="80" y1="188.6" x2="720" y2="188.6" stroke="#dddddd"/>
    <text x="68" y="193.1" text-anchor="end">8</text>
    <line x1="80" y1="145.7" x2="720" y2="145.7" stroke="#eeeeee"/>
    <text x="68" y="150.2" text-anchor="end">10</text>
    <line x1="80" y1="102.9" x2="720" y2="102.9" stroke="#dddddd"/>
    <text x="68" y="107.4" text-anchor="end">12</text>
    <line x1="80" y1="60.0" x2="720" y2="60.0" stroke="#eeeeee"/>
    <text x="68" y="64.5" text-anchor="end">14</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#555555">
    <line x1="80" y1="360" x2="80" y2="366" stroke="#333333"/>
    <text x="80" y="386" text-anchor="middle">4</text>
    <line x1="336" y1="360" x2="336" y2="366" stroke="#333333"/>
    <text x="336" y="386" text-anchor="middle">8</text>
    <line x1="592" y1="360" x2="592" y2="366" stroke="#333333"/>
    <text x="592" y="386" text-anchor="middle">12</text>
    <line x1="720" y1="360" x2="720" y2="366" stroke="#333333"/>
    <text x="720" y="386" text-anchor="middle">14</text>
  </g>

  <text x="400" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333333">GPUs / MPI ranks</text>
  <text x="22" y="210" text-anchor="middle" transform="rotate(-90 22 210)" font-family="Arial, sans-serif" font-size="16" fill="#333333">Simulated days per hour</text>

  <polyline points="80,267.9 336,183.4 592,148.7 720,187.3" fill="none" stroke="#156082" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="80,279.6 336,222.0 592,200.1 720,218.6" fill="none" stroke="#e97132" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="80,201.4 336,100.7" fill="none" stroke="#2ca02c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="80" cy="267.9" r="5.5" fill="#156082"/><circle cx="336" cy="183.4" r="5.5" fill="#156082"/><circle cx="592" cy="148.7" r="5.5" fill="#156082"/><circle cx="720" cy="187.3" r="5.5" fill="#156082"/>
    <circle cx="80" cy="279.6" r="5.5" fill="#e97132"/><circle cx="336" cy="222.0" r="5.5" fill="#e97132"/><circle cx="592" cy="200.1" r="5.5" fill="#e97132"/><circle cx="720" cy="218.6" r="5.5" fill="#e97132"/>
    <circle cx="80" cy="201.4" r="5.5" fill="#2ca02c"/><circle cx="336" cy="100.7" r="5.5" fill="#2ca02c"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#333333">
    <line x1="155" y1="448" x2="195" y2="448" stroke="#156082" stroke-width="4" stroke-linecap="round"/><circle cx="175" cy="448" r="5.5" fill="#156082"/>
    <text x="205" y="453">local mem:managed</text>
    <line x1="355" y1="448" x2="395" y2="448" stroke="#e97132" stroke-width="4" stroke-linecap="round"/><circle cx="375" cy="448" r="5.5" fill="#e97132"/>
    <text x="405" y="453">local mem:unified</text>
    <line x1="555" y1="448" x2="595" y2="448" stroke="#2ca02c" stroke-width="4" stroke-linecap="round"/><circle cx="575" cy="448" r="5.5" fill="#2ca02c"/>
    <text x="605" y="453">Everett mem:unified AsyncIO</text>
  </g>
</svg>
